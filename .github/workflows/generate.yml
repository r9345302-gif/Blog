name: Robô de posts (IA)

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # evita o minuto :00, quando o GitHub mais atrasa os agendamentos
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Instala só o que o robô precisa (scripts/package.json). O package.json da raiz é do site
      # e o npm falha nele (erro "edgesOut"), por isso não é usado aqui.
      - name: Instalar dependências do robô
        working-directory: scripts
        run: npm install --no-audit --no-fund --ignore-scripts
      - id: run
        run: node --experimental-strip-types scripts/generate.ts
        env:
          # Usa o secret SUPABASE_URL se existir; senão, a variável VITE_SUPABASE_URL (mesma URL, pública).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_POSTS_PER_RUN: "2"
          # Opcional: aviso no Discord/Slack/Telegram quando um nicho for pausado (crie o secret ALERT_WEBHOOK_URL).
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      - name: Recriar o site
        if: steps.run.outputs.deploy == 'true' || steps.run.outputs.published == 'true'
        run: gh workflow run deploy.yml --ref ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
