name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild so posts approved manually in the admin also go live.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build estático
        run: bun run build
        env:
          STATIC_EXPORT: "1"
          SITE_BASE: ${{ vars.SITE_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Localizar pasta gerada
        id: out
        run: |
          dir=""
          for d in .output/public dist/client dist; do
            if [ -f "$d/index.html" ]; then dir="$d"; break; fi
          done
          if [ -z "$dir" ]; then echo "ERRO: nenhuma pasta de build com index.html encontrada"; exit 1; fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Sitemap, robots e 404
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          node --experimental-strip-types scripts/build-sitemap.ts "$DIR"
          cp "$DIR/index.html" "$DIR/404.html" 2>/dev/null || true
          [ -n "${{ vars.CUSTOM_DOMAIN }}" ] && echo "${{ vars.CUSTOM_DOMAIN }}" > "$DIR/CNAME" || true
          touch "$DIR/.nojekyll"
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
