name: Publicar site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily rebuild so posts approved manually in the admin also go live.
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build estático
        run: |
          echo "Versão do código: $(git log -1 --format='%h %ci')"
          grep -q "prerender" vite.config.ts && echo "vite.config com prerender: OK" || echo "AVISO: vite.config.ts desatualizado (sem prerender)"
          node --version
          # O "| tee" esconde o código de saída do build: guardamos para avisar (scripts/verify-build.ts decide se publica).
          set +e
          bun run build 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" != "0" ]; then echo "::warning title=Build::o comando de build terminou com código $BUILD_STATUS"; fi
          echo "== Resumo do prerender =="
          grep -E "prerender|Prerender|error|Error" build.log | grep -v "^\[prerender\] - " | tail -30 || true
        env:
          STATIC_EXPORT: "1"
          SITE_BASE: ${{ vars.SITE_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Localizar pasta gerada
        id: out
        run: |
          echo "== Arquivos gerados (diagnóstico) =="
          ls -la .output .output/public dist dist/client 2>/dev/null || true
          find . -path ./node_modules -prune -o \( -name index.html -o -name _shell.html \) -print 2>/dev/null | head -20
          dir=""
          for d in .output/public dist/client dist; do
            if [ -f "$d/index.html" ]; then dir="$d"; break; fi
          done
          # Fallback: build SPA pode gerar só _shell.html — vira o index.html.
          if [ -z "$dir" ]; then
            for d in .output/public dist/client dist; do
              if [ -f "$d/_shell.html" ]; then cp "$d/_shell.html" "$d/index.html"; dir="$d"; break; fi
            done
          fi
          # Último recurso: qualquer pasta (fora de node_modules) com index.html ou _shell.html.
          if [ -z "$dir" ]; then
            f=$(find . -path ./node_modules -prune -o \( -name index.html -o -name _shell.html \) -print 2>/dev/null | grep -v '/server/' | head -1)
            if [ -n "$f" ]; then
              dir=$(dirname "$f")
              [ -f "$dir/index.html" ] || cp "$f" "$dir/index.html"
            fi
          fi
          if [ -z "$dir" ]; then echo "ERRO: nenhuma pasta de build com index.html encontrada. Abra o passo 'Build estático' para ver o log."; exit 1; fi
          echo "Usando pasta: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Sitemap, robots e 404
        run: |
          DIR="${{ steps.out.outputs.dir }}"
          node --experimental-strip-types scripts/build-sitemap.ts "$DIR"
          # 404.html = casca SPA (_shell.html) quando existir: rotas não pré-renderizadas (ex.: /admin) carregam por ela.
          if [ -f "$DIR/_shell.html" ]; then cp "$DIR/_shell.html" "$DIR/404.html"; else cp "$DIR/index.html" "$DIR/404.html" 2>/dev/null || true; fi
          [ -n "${{ vars.CUSTOM_DOMAIN }}" ] && echo "${{ vars.CUSTOM_DOMAIN }}" > "$DIR/CNAME" || true
          touch "$DIR/.nojekyll"
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Se algo estiver errado (post sem página, links sem /Blog/, variáveis vazias), o deploy para aqui
      # e o site anterior continua no ar. Para desligar temporariamente: variável VERIFY_BUILD=off.
      - name: Verificar o site gerado
        if: ${{ vars.VERIFY_BUILD != 'off' }}
        run: node --experimental-strip-types scripts/verify-build.ts "${{ steps.out.outputs.dir }}"
        env:
          SITE_BASE: ${{ vars.SITE_BASE }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
